name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install ldid dpkg make
      
      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
      
      - name: Install iOS 15 SDK
        run: |
          cd $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/iPhoneOS15.5.sdk .
          rm -rf sdks-master sdks.zip
          ls -la
      
      - name: Build .deb package
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH
          make clean
          make package FINALPACKAGE=1
          ls -la packages/
      
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoreRecentSongsPlz-deb
          path: packages/*.deb
          retention-days: 30
